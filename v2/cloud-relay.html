<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'">
  <title>Replay A11y · Gemini relay</title>
  <link rel="stylesheet" href="/src/style.css">
  <script type="module" src="/src/cloud-relay.js"></script>
</head>
<body>
<main>
  <h1>Gemini relay</h1>
  <p lang="ko">이 탭에는 원문이나 전체 초안이 없습니다. 결과는 작업 탭에 표시됩니다. 이 탭을 닫아 요청을 취소할 수 있습니다.</p>
  <p>This tab has no original recording or full draft. The result appears in the workspace tab. You can close this tab to cancel; a request that has already left cannot be recalled.</p>
  <p id="relay-status" role="status" aria-atomic="true">Waiting for the workspace…</p>
  <button id="relay-close" type="button">Close relay tab</button>
</main>
</body>
</html>
